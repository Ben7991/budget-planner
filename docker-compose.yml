services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget_planner
    ports:
      - "5432:5432"
    volumes:
      - budget_planner_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget_planner"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  budget_planner_postgres:
